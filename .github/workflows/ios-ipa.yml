name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "HauntedRoom/**"
      - "HauntedRoomTests/**"
      - "HauntedRoom.xcodeproj/**"
      - ".github/workflows/ios-ipa.yml"

permissions:
  contents: read

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on Simulator
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project HauntedRoom.xcodeproj \
            -scheme HauntedRoom \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO

  build-ipa:
    name: Build Unsigned IPA
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build Release for device
        run: |
          set -o pipefail
          xcodebuild build \
            -project HauntedRoom.xcodeproj \
            -scheme HauntedRoom \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP="build/DerivedData/Build/Products/Release-iphoneos/HauntedRoom.app"
          test -d "$APP"
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          (cd build && zip -qry HauntedRoom-unsigned.ipa Payload)
          unzip -l build/HauntedRoom-unsigned.ipa | head -n 20
          ls -lh build/HauntedRoom-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: HauntedRoom-unsigned-ipa
          path: build/HauntedRoom-unsigned.ipa
          if-no-files-found: error
          retention-days: 15
